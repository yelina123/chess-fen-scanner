name: chess_fen_app
description: "国际象棋棋盘截图 → FEN 离线识别（Flutter 重构版）"

publish_to: 'none'

version: 2.0.2+25

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  chessground: ^10.1.1
  dartchess: ^0.13.1
  image: ^4.3.0
  image_picker: ^1.1.2
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

